<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon List - Pokémon Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <h1 class="text-center my-4">Pokémon Collection</h1>
  <div class="container py-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-3">
        <div class="card shadow-lg">
          <img src="images/sandslash.png" class="card-img-top" alt="Sandslash">
          <div class="card-body text-center">
            <h5 class="card-title">Sandslash (#0028)</h5>
            <p class="card-text text-muted">Type: Ground</p>
            <a href="sandslash.html" class="btn btn-gradient">View Details</a>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-lg">
          <img src="images/nidoran-f.png" class="card-img-top" alt="Nidoran♀">
          <div class="card-body text-center">
            <h5 class="card-title">Nidoran♀ (#0029)</h5>
            <p class="card-text text-muted">Type: Poison</p>
            <a href="nidoran-f.html" class="btn btn-gradient">View Details</a>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-lg">
          <img src="images/clefairy.png" class="card-img-top" alt="Clefairy">
          <div class="card-body text-center">
            <h5 class="card-title">Clefairy (#0035)</h5>
            <p class="card-text text-muted">Type: Fairy</p>
            <a href="clefairy.html" class="btn btn-gradient">View Details</a>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-lg">
          <img src="images/vulpix.png" class="card-img-top" alt="Vulpix">
          <div class="card-body text-center">
            <h5 class="card-title">Vulpix (#0037)</h5>
            <p class="card-text text-muted">Type: Fire</p>
            <a href="vulpix.html" class="btn btn-gradient">View Details</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
